name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: ./build.sh release
      - run: |
          mkdir -p dist
          tar -czf "dist/grapplemap-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C build grapplemap
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with: { path: dist, pattern: bin-*, merge-multiple: true }
      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: notes.md
          files: dist/*
