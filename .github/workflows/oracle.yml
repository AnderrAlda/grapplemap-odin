# Oracle workflow (#36): builds the original in Docker (tools/oracle) and checks the committed fixtures against it.
# Separate from ci.yml and not a required check. `./build.sh oracle --images` is never run here: PNGs depend on
# Mesa and are regenerated by hand (ADR 0002).
name: oracle
on:
  pull_request:
    paths:
      - tools/oracle/**
      - reference/GrappleMap # exact path: only the submodule pointer
      - tests/fixtures/oracle/**
      - .github/workflows/oracle.yml
  push:
    branches: [main]
    paths:
      - tools/oracle/**
      - reference/GrappleMap
      - tests/fixtures/oracle/**
      - .github/workflows/oracle.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle:
    runs-on: ubuntu-latest # amd64, like the image
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Layer cache key
        id: key
        run: |
          echo "hash=$(git ls-files -s tools/oracle | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "sub=$(git -C reference/GrappleMap rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore image layer cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/oracle-cache
          key: oracle-layers-${{ steps.key.outputs.hash }}-${{ steps.key.outputs.sub }}
          restore-keys: |
            oracle-layers-${{ steps.key.outputs.hash }}-
            oracle-layers-
      - name: Buildx builder (container driver, needed to export a local cache)
        run: docker buildx create --use --name oracle-builder
      - name: Build image, sample and full dump
        env:
          ORACLE_BUILD_FLAGS: >-
            --load
            --cache-from type=local,src=${{ runner.temp }}/oracle-cache
            --cache-to type=local,dest=${{ runner.temp }}/oracle-cache,mode=max
        run: |
          ./build.sh oracle --sample
          if [ -n "$(git status --porcelain tests/fixtures/oracle)" ]; then
            git status --porcelain tests/fixtures/oracle
            git diff --stat -- tests/fixtures/oracle
            echo "::error::the regenerated sample differs from tests/fixtures/oracle (fixtures are never regenerated in CI)"
            exit 1
          fi
          # build.sh only compares when FULL.sha256 exists: a missing file must fail here.
          if [ ! -f tests/fixtures/oracle/FULL.sha256 ]; then
            echo "::error::tests/fixtures/oracle/FULL.sha256 is missing"
            exit 1
          fi
          ./build.sh oracle --full
      - name: Upload the full dump
        uses: actions/upload-artifact@v7.0.2
        with:
          name: oracle-full-dump
          path: build/oracle/full/
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
